<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>FirmForge Serial</title>
<style>
:root{--bg:#0f172a;--hdr:#1e293b;--txt:#e2e8f0;--dim:#94a3b8;--acc:#22d3ee;--warn:#ef4444;--btn-bg:#334155;--btn-hover:#475569;--sep:#2d3748;--tx-clr:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--hdr);border-bottom:1px solid var(--sep);flex-shrink:0;min-height:40px}
.bar select,.bar input{background:var(--hdr);border:1px solid var(--sep);color:var(--txt);padding:4px 8px;font-size:13px;border-radius:4px}
.bar button{border:1px solid var(--acc);background:transparent;color:var(--acc);padding:4px 14px;border-radius:4px;font-size:13px;cursor:pointer}
.bar button:hover{background:var(--btn-hover)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tabs{display:flex;background:var(--hdr);border-bottom:1px solid var(--sep)}
.tab{padding:7px 18px;font-size:13px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent}
.tab.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.serial-out{flex:1;overflow-y:auto;padding:8px 14px;font-family:"Cascadia Code",Consolas,monospace;font-size:13px;line-height:1.1;min-height:0;white-space:pre}
.serial-sendbar{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--sep);align-items:center}
.serial-sendbar input{flex:1;background:var(--hdr);border:1px solid var(--sep);color:var(--txt);padding:6px 10px;font-size:13px;border-radius:4px;font-family:"Cascadia Code",monospace}
.serial-sendbar button{border:1px solid var(--acc);background:transparent;color:var(--acc);padding:5px 14px;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap}
.serial-sendbar label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.status{display:flex;gap:14px;padding:3px 12px;font-size:12px;color:#64748b;border-top:1px solid var(--sep);flex-shrink:0;white-space:nowrap}
.modbus{display:none;flex-direction:column;flex:1;min-height:0}
.modbus.show{display:flex}
.mbbar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--hdr);border-bottom:1px solid var(--sep);flex-shrink:0;flex-wrap:wrap;font-size:13px}
.mbbar select,.mbbar input{background:var(--btn-bg);border:1px solid var(--sep);color:var(--txt);padding:4px 8px;font-size:13px;border-radius:3px}
.mbbar button{border:1px solid var(--acc);background:transparent;color:var(--acc);padding:4px 14px;border-radius:3px;font-size:13px;cursor:pointer;white-space:nowrap}
.mbbar button:hover{background:var(--btn-hover)}
.mblog{flex:1;overflow-y:auto;padding:8px 14px;font-family:"Cascadia Code",Consolas,monospace;font-size:12px;line-height:1.5;min-height:0}
.mb-line{display:flex;align-items:baseline;gap:8px;padding:1px 0}
.mb-line .tag{font-weight:600;font-size:10px;padding:0 4px;border-radius:2px;flex-shrink:0}
.mb-line .tag.tx{color:#f59e0b}
.mb-line .tag.rx{color:#4ade80}
.mb-line .tag.ok{color:#4ade80}
.mb-line .tag.err{color:#ef4444}
.mb-line .ts{color:var(--dim);font-size:10px;flex-shrink:0}
.mb-line .raw{color:var(--txt);word-break:break-all}
.mb-decode{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:2px;padding:4px 0 6px 20px;font-size:11px}
.mb-decode .cell{background:var(--hdr);padding:3px 5px;border-radius:2px;text-align:center}
.mb-decode .cell .addr{color:var(--dim);font-size:9px}
.mb-decode .cell .val{color:var(--txt)}
</style></head>
<body>
<div class="bar">
  <span class="dot" style="background:var(--acc);flex-shrink:0"></span>
  <span style="color:var(--acc);font-weight:600;font-size:14px;margin-left:6px">FirmForge</span>
  <select id="portsel"><option>COM4</option></select>
  <select id="baudsel" onchange="location.href=location.pathname.split('?')[0]+'?baud='+this.value">
    <option value="9600">9600</option><option value="19200">19200</option>
    <option value="38400">38400</option><option value="57600">57600</option>
    <option value="115200">115200</option>
  </select>
  <select id="framsel"><option>8N1</option><option>8E1</option><option>8O1</option></select>
  <select id="paritysel"><option>None</option><option>Even</option><option>Odd</option></select>
  <button style="border-color:var(--sep);color:var(--txt);font-size:13px;padding:4px 12px;margin-left:auto" onclick="doClearOutput()">Clear</button>
  <button id="connbtn" onclick="doToggleConn()">Close</button>
</div>
<div class="bar" style="min-height:28px;padding:2px 14px;font-size:13px;color:var(--dim)">
  <span id="stages"><span style="color:#4ade80">&#9989;</span><span style="color:var(--dim)">S1:20ms</span>  <span style="color:#4ade80">&#9989;</span><span style="color:var(--dim)">S2:102ms</span>  <span style="color:#4ade80">&#9989;</span><span style="color:var(--dim)">S3:1517ms</span>  <span style="color:#4ade80">&#9989;</span><span style="color:var(--dim)">S4:3063ms</span></span>
  <span style="margin-left:auto">RX: <span id="rxval">0</span>  TX: <span id="txval">8</span></span>
</div>
<div class="bar" style="min-height:28px;padding:2px 14px;font-size:13px;color:var(--dim);gap:12px">
  <span id="process">S3:build&times;1  S4:flash@115200(retry=0)</span>
  <span id="tsval" style="margin-left:auto">2026-07-30 22:31:06</span>
</div>
<div class="tabs">
  <div class="tab on" onclick="switchTab('serial')" id="tab-serial">Serial</div>
  <div class="tab" onclick="switchTab('modbus')" id="tab-modbus">MODBUS</div>
</div>
<div class="serial-out" id="serial-out"><div class="line"><span style="color:var(--tx-clr)">[TX MODBUS]</span> (no response)</div>
</div><!--/output-->
<div class="modbus" id="modbus-panel">
  <div class="mbbar">
    Slave <input id="modbus-slave" value="1" style="width:40px">
    FC <select id="modbus-func" onchange="doFcChange()" style="width:145px">
      <option value="3">03 Read Holding Reg</option><option value="4">04 Read Input Reg</option>
      <option value="6">06 Write Single Reg</option><option value="16">16 Write Multiple Reg</option></select>
    Addr <input id="modbus-addr" value="0" style="width:50px">
    Count <input id="modbus-count" value="10" style="width:40px">
    <span id="modbus-data-row" style="display:none">Data <input id="modbus-data" value="0" style="width:60px" placeholder="val1,..."></span>
    <button onclick="doModbusSend()" style="margin-left:auto">Send</button>
  </div>
  <div class="mblog" id="modbus-log"></div>
</div>
<div class="serial-sendbar">
  <input id="serial-input" placeholder="type text or HEX..." onkeydown="if(event.key=='Enter')doSerialSend()">
  <label><input type="checkbox" id="hexchk">HEX</label>
  <label><input type="checkbox" id="crlfchk" checked>CRLF</label>
  <button onclick="doSerialSend()" style="margin-left:auto">Send</button>
</div>
</div>
<script>
var serialOut=document.getElementById("serial-out"),isOpen=true,dot=document.querySelector(".dot");

function doToggleConn(){
  if(isOpen){
    dot.style.background="var(--warn)";
    document.getElementById("connbtn").textContent="Closing...";
    fetch("/serial-close",{method:"POST"}).then(function(){
      isOpen=false;
      document.getElementById("connbtn").textContent="Open";
      document.getElementById("serial-out").style.opacity="0.4";
      document.getElementById("serial-input").disabled=true;
    });
  }else{
    dot.style.background="#22d3ee";
    document.getElementById("connbtn").textContent="Opening...";
    fetch("/serial-open",{method:"POST"}).then(function(){
      isOpen=true;
      dot.style.background="var(--acc)";
      document.getElementById("connbtn").textContent="Close";
      document.getElementById("serial-out").style.opacity="1";
      document.getElementById("serial-input").disabled=false;
      serialOut.innerHTML="";
    });
  }
}
function switchTab(t){
  document.getElementById("tab-serial").className="tab"+(t=="serial"?" on":"");
  document.getElementById("tab-modbus").className="tab"+(t=="modbus"?" on":"");
  document.getElementById("serial-out").style.display=t=="serial"?"":"none";
  document.getElementById("modbus-panel").className="modbus"+(t=="modbus"?" show":"");
  document.querySelector(".serial-sendbar").style.display=t=="modbus"?"none":"";
}
function doSerialSend(){
  var v=document.getElementById("serial-input").value;if(!v)return;
  var hex=document.getElementById("hexchk").checked;
  var crlf=document.getElementById("crlfchk").checked;
  fetch("/serial-send",{method:"POST",body:JSON.stringify({text:v,hex:hex,crlf:crlf})});
  document.getElementById("serial-input").value="";
}
var modbusFrameNum=0,modbusLog=document.getElementById("modbus-log");
function mbCrc(buf){
  var crc=0xFFFF;
  for(var i=0;i<buf.length;i++){crc^=buf[i];for(var j=0;j<8;j++)crc=(crc&1)?(crc>>1)^0xA001:crc>>1;}
  return [crc&0xFF,(crc>>8)&0xFF];
}
function mb2hex(buf){var h="";for(var i=0;i<buf.length;i++)h+=("0"+buf[i].toString(16)).slice(-2).toUpperCase()+" ";return h.trim();}
function doModbusSend(){
  var slave=parseInt(document.getElementById("modbus-slave").value)||1;
  var fc=parseInt(document.getElementById("modbus-func").value)||3;
  var addr=parseInt(document.getElementById("modbus-addr").value)||0;
  var count=parseInt(document.getElementById("modbus-count").value)||1;
  var data=document.getElementById("modbus-data").value;
  var ts=new Date(),tsStr=("0"+ts.getHours()).slice(-2)+":"+("0"+ts.getMinutes()).slice(-2)+":"+("0"+ts.getSeconds()).slice(-2);
  var pdu=[slave,fc,(addr>>8)&0xFF,addr&0xFF];
  if(fc==6){pdu.push((count>>8)&0xFF,count&0xFF);}
  else if(fc==16){
    var vals=data.split(",").map(function(x){return parseInt(x.trim())||0;});
    pdu.push((count>>8)&0xFF,count&0xFF,(vals.length*2>>8)&0xFF,vals.length*2&0xFF);
    for(var k=0;k<vals.length;k++){pdu.push((vals[k]>>8)&0xFF,vals[k]&0xFF);}
  }else{pdu.push((count>>8)&0xFF,count&0xFF);}
  var crc=mbCrc(pdu);pdu.push(crc[0],crc[1]);
  var txHex=mb2hex(pdu);
  modbusFrameNum++;
  var entry=document.createElement("div");
  entry.id="modbus-entry-"+modbusFrameNum;
  entry.innerHTML='<div class="mb-line"><span class="tag tx">TX\u2192</span><span class="ts">'+tsStr+'</span><span class="raw">'+txHex+'</span></div><div class="mb-line"><span style="color:var(--dim);font-size:10px;padding-left:16px">waiting for reply...</span></div>';
  modbusLog.insertBefore(entry, modbusLog.firstChild);
  fetch("/modbus",{method:"POST",body:JSON.stringify({
    mb:{slave:slave,fc:fc,addr:addr,count:count,data:data},
    tx_hex:txHex,
    port:document.getElementById("portsel").value||"COM4",
    baud:parseInt(document.getElementById("baudsel").value)||9600
  })})
  .then(function(r){return r.json();})
  .then(function(d){
    var e=document.getElementById("modbus-entry-"+modbusFrameNum);
    if(!e)return;
    var raw=d.raw||"";
    if(d.error){
      e.innerHTML='<div class="mb-line"><span class="tag tx">TX\u2192</span><span class="ts">'+tsStr+'</span><span class="raw">'+txHex+'</span></div><div class="mb-line"><span class="tag err">ERR</span><span class="raw" style="color:var(--warn)">'+d.error+'</span></div>';
    }else if(raw){
      var parts=raw.trim().split(/[\\s,]+/);
      var bytes=[];for(var i=0;i<parts.length;i++){var b=parseInt(parts[i],16);if(!isNaN(b))bytes.push(b);}
      if(bytes.length>=3&&(bytes[1]&0x80)){
        var exc=bytes[2];var msgs=["Illegal Function","Illegal Data Address","Illegal Data Value","Slave Failure","Acknowledge","Slave Busy"];
        e.innerHTML='<div class="mb-line"><span class="tag tx">TX\u2192</span><span class="ts">'+tsStr+'</span><span class="raw">'+txHex+'</span></div><div class="mb-line"><span class="tag err">RX\u2190</span><span class="raw" style="color:var(--warn)">'+raw+'</span></div><div class="mb-line"><span style="color:var(--warn);padding-left:16px">Exception: '+exc+' '+(msgs[exc-1]||"")+'</span></div>';
      }else if(bytes.length>=3&&(bytes[1]==fc||(fc==3&&bytes[1]==3))){
        var regBytes=bytes.slice(3,bytes.length-2);
        var regs=[];for(var i=0;i<regBytes.length;i+=2)regs.push((regBytes[i]<<8)+(regBytes[i+1]||0));
        var h='<div class="mb-line"><span class="tag rx">RX\u2190</span><span class="ts">'+tsStr+'</span><span class="raw">'+raw+'</span></div>';
        if(regs.length){h+='<div class="mb-decode">';regs.forEach(function(v,i){h+='<div class="cell"><div class="addr">'+(addr+i)+'</div><div class="val">'+v+'</div></div>';});h+='</div>';}
        e.innerHTML='<div class="mb-line"><span class="tag tx">TX\u2192</span><span class="ts">'+tsStr+'</span><span class="raw">'+txHex+'</span></div>'+h;
      }else{
        e.innerHTML='<div class="mb-line"><span class="tag tx">TX\u2192</span><span class="ts">'+tsStr+'</span><span class="raw">'+txHex+'</span></div><div class="mb-line"><span class="tag rx">RX\u2190</span><span class="raw">'+raw+'</span></div>';
      }
    }else{
      e.innerHTML='<div class="mb-line"><span class="tag tx">TX\u2192</span><span class="ts">'+tsStr+'</span><span class="raw">'+txHex+'</span></div><div class="mb-line"><span style="color:var(--dim);padding-left:16px">response pending (server stored)</span></div>';
    }
  });
}
function doClearOutput(){serialOut.innerHTML="";}
function doFcChange(){
  var fc=parseInt(document.getElementById("modbus-func").value);
  document.getElementById("modbus-count").style.display=(fc==6)?"none":"";
  document.getElementById("modbus-data-row").style.display=(fc==6||fc==16)?"inline":"none";
}
var es=new EventSource("http://127.0.0.1:9878/stream");
es.onmessage=function(e){
  var d=JSON.parse(e.data);
  if(d.new){for(var i=0;i<d.new.length;i++)serialOut.insertAdjacentHTML("beforeend",'<div class="line">'+d.new[i]+'</div>');serialOut.scrollTop=serialOut.scrollHeight;}
  document.getElementById("rxval").innerHTML=d.rx||0;
  document.getElementById("txval").innerHTML=d.tx||0;
  document.getElementById("tsval").innerHTML=d.ts||"";
  if(d.stages)document.getElementById("stages").innerHTML=d.stages;
  if(d.ts){
    var hm=d.ts.split(" ")[1];
    if(hm){var p=hm.split(":").map(Number),fs=p[0]*3600+p[1]*60+p[2];
    var ns=new Date().getHours()*3600+new Date().getMinutes()*60+new Date().getSeconds();
    dot.style.background=Math.abs(ns-fs)<4?"var(--acc)":"var(--warn)";}
  }
};
es.onerror=function(){dot.style.background="var(--warn)";};
</script>
</body></html>
