[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firmforge"
version = "0.1.0"
description = "FirmForge — Multi-MCU firmware verification toolchain"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.scripts]
ff = "firmforge.adapters.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
mcp = ["mcp>=1.0"]

[tool.setuptools.packages.find]
include = ["firmforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
