[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firmforge"
version = "0.3.0"
description = "FirmForge — Multi-MCU firmware verification toolchain (Review → Build → Flash → Verify)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FirmForge Contributors" }]
keywords = ["mcu", "firmware", "avr", "arduino", "modbus", "toolchain", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/firmforge/firmforge"
Repository = "https://github.com/NotchStone/firmforge"
Issues = "https://github.com/NotchStone/firmforge/issues"

[project.scripts]
ff = "firmforge.adapters.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
mcp = ["mcp>=1.0"]
build = ["build>=1.0", "twine>=4.0"]

[tool.setuptools.packages.find]
include = ["firmforge*"]

# Package data: bundled board definitions, chip knowledge, toolchain manifests
[tool.setuptools.package-data]
firmforge = [
    "data/**/*",
    "data/boards/**/*.yaml",
    "data/boards/**/*.json",
    "data/knowledge/**/*.json",
    "data/vendor/**/*.yaml",
    "tools/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
