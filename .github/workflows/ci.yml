name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check firmforge/ --ignore E501,F841

      - name: Import smoke test
        run: |
          python -c "import firmforge; print('FirmForge imported OK')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  smoke-avr:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -e ".[test]"

      - name: Install AVR toolchain
        run: sudo apt-get install -y -qq gcc-avr avr-libc binutils-avr

      - name: Link to canonical path
        run: |
          mkdir -p ~/.firmforge/toolchains/avr-gcc/bin
          cp /usr/bin/avr-gcc ~/.firmforge/toolchains/avr-gcc/bin/
          cp /usr/bin/avr-objcopy ~/.firmforge/toolchains/avr-gcc/bin/

      - name: Download Arduino core
        run: |
          curl -sSL https://downloads.arduino.cc/cores/avr-1.8.6.tar.bz2 | tar xj
          mkdir -p ~/.firmforge/packages/arduino/avr/1.8.6
          mv avr/cores avr/libraries avr/variants ~/.firmforge/packages/arduino/avr/1.8.6/
          rm -rf avr

      - name: Smoke build (Arduino Blink)
        run: python -m firmforge build arduino_328p --app vendor/arduino/examples/01_Basics_Blink
