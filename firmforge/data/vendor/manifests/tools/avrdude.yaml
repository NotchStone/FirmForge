# AVRDUDE 烧录工具 — extracted from the ZakKemble avr-gcc bundle (v14.1.0-1, AVRDUDE 7.2)
# On Windows/macOS avrdude ships inside the avr-gcc zip; on Linux use the system
# package: sudo apt install avrdude  (or brew install avrdude on macOS).
tool: avrdude
version: "7.2"
platforms:
  windows:
    url: "https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-windows.zip"
    sha256: ""
  linux-x86_64:
    url: ""  # system package: sudo apt install avrdude
    sha256: ""
  macos:
    url: "https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-windows.zip"
    sha256: ""

install:
  root: "~/.firmforge/toolchains/avrdude/"
  bin: "bin/avrdude"
  conf: "bin/avrdude.conf"
  binaries: [avrdude]
  # 探测顺序（probe → probe_glob → PATH）。canonical 布局是 bin/ 子目录
  # （setup.py 从 avr-gcc bundle 抽出后复制到 root/bin/）；扁平 root 是
  # 旧布局兼容 —— bin_exists 只认文件，两者不会误命中对方。
  probe:
    - "~/.firmforge/toolchains/avrdude/bin"
    - "~/.firmforge/toolchains/avrdude"
  probe_glob:
    - "~/AppData/Local/Microsoft/WinGet/Packages/AVRDudes.AVRDUDE*"  # winget（exe 在包根目录）
  # Avrdude is bundled inside the avr-gcc archive — copy bin/avrdude* after
  # avr-gcc is installed instead of downloading the archive again.
  from_gcc: true
