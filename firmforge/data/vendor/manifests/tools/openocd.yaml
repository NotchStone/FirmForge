# OpenOCD — STM32 SWD 烧录与调试（xPack build 0.12.0）
#
# 例外 E3（标准 §3.1）：本机位于 ~/AppData/Local/mcu-tools/openocd，
# 不在 B 区内。FirmForge 只声明与探测，不下载不搬运。
#
# 与 avrdude 的分工：avrdude 走 ISP/UART（AVR），OpenOCD 走 SWD/JTAG
# （ARM）。DAPLink 是 CMSIS-DAP 协议，OpenOCD 需要 cmsis-dap interface cfg；
# 若 OpenOCD 不通，pyOCD 是 DAPLink 的主场（备用通道）。
tool: openocd
version: "0.12.0"
type: external

platforms:
  windows:
    url: "https://github.com/xpack-dev-tools/openocd-xpack/releases"
    sha256: ""
  linux-x86_64:
    url: "https://github.com/xpack-dev-tools/openocd-xpack/releases"
    sha256: ""
  macos:
    url: "https://github.com/xpack-dev-tools/openocd-xpack/releases"
    sha256: ""

install:
  external: true
  # probe 条目语义 = **直接包含可执行文件的那一层目录**（见 setup._locate_external）。
  # xPack 布局是 <root>/bin/openocd.exe + <root>/openocd/scripts/，
  # 所以这里必须写到 `bin`，不能只写安装根。
  probe:
    - "~/AppData/Local/mcu-tools/openocd/bin"
    - "C:/Program Files/OpenOCD/bin"
    - "/usr/local/bin"
    - "/usr/bin"
  binaries:
    - "openocd"
  # OpenOCD 需要 -s 指定脚本目录（interface/*.cfg / target/*.cfg）。
  # 相对安装根解析，两种布局都覆盖：
  #   xPack  <root>/openocd/scripts      （实测本机）
  #   经典   <root>/share/openocd/scripts
  scripts_dir_candidates:
    - "../openocd/scripts"
    - "../share/openocd/scripts"
  purpose: "STM32 SWD 烧录 + 调试（DAPLink / CMSIS-DAP）"
  targets: "scripts/target/*.cfg；STM32H743ZITx 见 stm32h7x.cfg；探针 interface/cmsis-dap.cfg"
  register: "docs/路径分区标准.md §3.1 E3"
